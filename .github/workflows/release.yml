name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: swift test --skip AudioSystemTests   # live CoreAudio tests need a real output device
      - run: make release
      - name: Note the cask sha
        run: shasum -a 256 build/CallLane.zip > build/sha256.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/CallLane.zip
            build/sha256.txt
          body_path: build/sha256.txt
