name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: test "v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Sources/CallLane/Info.plist)" = "$GITHUB_REF_NAME"
      # Live CoreAudio suites need a real output device; EngineTests skips itself without the driver.
      - run: swift test --skip AudioSystemTests
      - run: make release   # app, driver, package, zip, sha256.txt, and the rendered cask
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/CallLane.zip
            build/sha256.txt
            build/calllane.rb
          body_path: build/sha256.txt
